name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:     # 수동 실행 가능

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev cmake \
          libffi-dev libssl-dev build-essential \
          ccache libsdl2-dev

    - name: Cache buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-

    - name: Install buildozer & kivymd
      run: |
        pip install --upgrade pip
        pip install buildozer cython kivymd

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tail -100

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoVault-APK
        path: bin/*.apk
        retention-days: 30

    - name: Show APK info
      run: ls -lh bin/*.apk 2>/dev/null || echo "APK not found"
